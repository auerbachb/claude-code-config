name: Rule Index & Word Count Lint

on:
  workflow_dispatch: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  rule-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Run rule-lint
        run: bash .github/scripts/rule-lint.sh
