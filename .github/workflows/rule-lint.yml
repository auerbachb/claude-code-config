name: Rule Index, Skill Catalog & Word Count Lint

on:
  workflow_dispatch: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  # The job id is the required status-check name on main. Do not rename it or
  # add a `name:` — either would silently drop the check from branch protection.
  # Doc lints are AUTO-DISCOVERED, not listed by name (issue #1138). Adding a
  # lint used to mean appending a step here, so every in-flight PR collided on
  # this file (PRs #801/#960/#1131; same pattern fixed for hook-scripts.yml in
  # issue #681). Now: drop a `*-lint.sh` file into .github/scripts/ and CI
  # runs it with NO edit to this file. See CONTRIBUTING.md "Adding a Doc Lint".
  # Discovery runner: .github/scripts/run-doc-lints.sh
  rule-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run doc lints (auto-discovered)
        run: bash .github/scripts/summarize-test-run.sh "Doc lints" .github/scripts/run-doc-lints.sh
