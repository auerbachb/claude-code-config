name: Hook scripts

# Every PR runs the Linux and Python hook-test jobs, each running only the suites the PR can
# affect (issue #2153; selector: .github/scripts/select-hook-tests.sh). A push to main
# runs the full set as the backstop: the selector answers ALL for any non-PR event.
# The macOS hook tests run after merge only (issue #2265): on a PR their jobs are skipped and
# the `hook-tests-macos` check passes with a notice; on push to main they run in full and a
# failure files or comments on a tracking issue (`hook-tests-macos-report`).
on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

# A new PR head supersedes the old one, so its queued/running Hook scripts run
# can only validate a commit nobody will merge (issue #1882). Group per workflow
# + PR number: a push to PR #N cancels only PR #N's older run here — other PRs
# and other workflows never share the group. The run_id fallback keeps any
# future non-pull_request trigger (where the PR number is empty) in a group of
# its own instead of one global group; that trigger set is pinned by
# .github/scripts/tests/hook-scripts-concurrency.test.sh.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Tests are AUTO-DISCOVERED, not listed by name (issue #681). Adding a test used
# to mean appending a `- name:/run:` step at the shared tail of these jobs, so
# every in-flight PR collided here (PRs #657/#658/#660/#661/#672/#676; #676 took
# 3 rebases). Now: drop a `*.test.sh` into a discovered dir, or a
# `tests/test_*.py` module, and CI runs it with NO edit to this file.
# Bash discovery: .github/scripts/run-hook-tests.sh
# Python discovery: .github/scripts/run-python-tests.sh (issue #771)
# See CONTRIBUTING.md "Adding a Test".
#
# Both runners are invoked with --json (issue #782) so the job log carries the compact
# result contract instead of every passing suite's raw fold — `gh run view` consumers
# read a verdict, not thousands of lines. Failing suites still print in full on stderr,
# and the complete capture lives at the contract's `log_path` on the runner.
# Contract: .claude/reference/compact-result-contract.md
jobs:
  # Issue #2207: the Linux full run is split into two shards on two runners, mirroring the macOS
  # pattern below. The plan decides once (the selector runs here, never in a shard) and a PR whose
  # selection is not the full set keeps ONE shard. The required check name stays `hook-tests`: the
  # aggregate job after the shards carries that name and passes only when the plan and every shard
  # succeed.
  hook-tests-plan:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      selection: ${{ steps.plan.outputs.selection }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the selector diffs the PR against its base SHA (issue #2153).
          fetch-depth: 0
          persist-credentials: false

      # Decide once which suites this PR can affect (issue #2153). Fail toward the full run: a
      # selector that exits non-zero hands the runners ALL, never a partial list.
      - name: Select hook test suites and decide the Linux shard count
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          SEL="$RUNNER_TEMP/hook-test-selection-linux-plan.txt"
          if ! bash .github/scripts/select-hook-tests.sh --event "$EVENT_NAME" --base "$BASE_SHA" > "$SEL"; then
            printf '# reason: selector exited non-zero: full run\nALL\n# end-of-selection\n' > "$SEL"
          fi
          if grep -Fxq 'ALL' "$SEL"; then
            SHARDS='[{"index":1,"count":2},{"index":2,"count":2}]'
          else
            SHARDS='[{"index":1,"count":1}]'
          fi
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "selection=$(base64 < "$SEL" | tr -d '\n')" >> "$GITHUB_OUTPUT"
          echo "Linux shards: $SHARDS"
          cat "$SEL"

  hook-tests-shard:
    needs: hook-tests-plan
    # The matrix is never empty: the plan always emits at least shard 1/1.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.hook-tests-plan.outputs.shards) }}
    name: hook-tests-shard ${{ matrix.index }}/${{ matrix.count }}
    # Keep the existing GNU userland assumptions stable across image migrations.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the selector diffs the PR against its base SHA (issue #2153).
          fetch-depth: 0
          persist-credentials: false

      # The selection is decided once, by hook-tests-plan, and passed here; shards never re-run the
      # selector, so every shard sees the same suite list the plan counted.
      - name: Restore the planned hook test selection
        env:
          SELECTION_B64: ${{ needs.hook-tests-plan.outputs.selection }}
        run: |
          SEL="$RUNNER_TEMP/hook-test-selection.txt"
          printf '%s' "$SELECTION_B64" | base64 -d > "$SEL" || { echo "::error::cannot restore the planned selection" >&2; exit 1; }
          echo "HOOK_TEST_SELECTION=$SEL" >> "$GITHUB_ENV"
          cat "$SEL"

      - name: Configure git (worktree tests)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      # PyYAML is a HARD dependency of the bash suites (issue #1392):
      # cursor-review-workflow-suppression.test.sh parses
      # .github/workflows/cursor-review-pr-comment.yml and exits 1 when `import yaml`
      # fails — skipping there would pass vacuously. ubuntu-latest happens to ship it
      # today, so this step DECLARES the dependency instead of inheriting it, pinned so
      # neither runner-image drift nor a bad release reddens this job for a
      # non-regression. Not redundant — "the image already has it" IS the exposure.
      #
      # The venv is the install TARGET, not job isolation: ubuntu-latest's python3 is
      # PEP 668 externally-managed, so a bare `pip install` only lands because the image
      # ships /etc/pip.conf `break-system-packages = true` — trading one undeclared image
      # dependency for another. A venv is immune. `--system-site-packages` keeps every
      # module the suites import today (venv site-packages still win, so the pin is what
      # `import yaml` resolves to), and building it from the ambient python3 keeps this
      # job on "whatever ubuntu-latest ships" — the 3.10+ counterpart to hook-tests-py39.
      - name: Install PyYAML (pinned — bash suites parse workflow YAML)
        run: |
          python3 -m venv --system-site-packages "$RUNNER_TEMP/pyyaml-venv"
          "$RUNNER_TEMP/pyyaml-venv/bin/python" -m pip install "PyYAML==6.0.3"
          echo "$RUNNER_TEMP/pyyaml-venv/bin" >> "$GITHUB_PATH"
          # $GITHUB_PATH only takes effect in LATER steps; mirror it here so the assert
          # resolves the same `python3` the suites will.
          export PATH="$RUNNER_TEMP/pyyaml-venv/bin:$PATH"
          python3 -c 'import yaml; assert yaml.__version__ == "6.0.3", f"PyYAML {yaml.__version__} on sys.path, expected 6.0.3"; print("PyYAML", yaml.__version__)'

      - name: Run bash hook + script test suites (auto-discovered, shard ${{ matrix.index }}/${{ matrix.count }})
        run: bash .github/scripts/summarize-test-run.sh "Bash test suites (shard ${{ matrix.index }}/${{ matrix.count }})" .github/scripts/run-hook-tests.sh --shard "${{ matrix.index }}/${{ matrix.count }}" --timing-file "$RUNNER_TEMP/hook-test-timing.tsv" --only-file "$HOOK_TEST_SELECTION"

      # Advisory: the full per-suite table (every suite, not only the slowest 30) for balancing the
      # shards (issue #2207). Collapsed, so it never buries a failing suite's output.
      - name: Print per-suite timings (collapsed)
        if: always()
        run: |
          F="$RUNNER_TEMP/hook-test-timing.tsv"
          echo "::group::Per-suite timings, Linux shard ${{ matrix.index }}/${{ matrix.count }} (seconds, kind, path)"
          if [ -s "$F" ]; then sort -t "$(printf '\t')" -k1,1nr "$F"; else echo "no timing table was written"; fi
          echo "::endgroup::"

      # run-python-tests.sh has no --shard, so the Python suites run once, in shard 1/n (the whole
      # Python set, not a share of it). Every other step above runs in each shard.
      - name: Run Python hook unit tests (auto-discovered, shard 1 only)
        if: matrix.index == 1
        run: bash .github/scripts/summarize-test-run.sh "Python unit tests" .github/scripts/run-python-tests.sh --only-file "$HOOK_TEST_SELECTION"

  # The one check branch protection requires for Linux. It reports once per PR and passes only when
  # the plan and every shard finished with success.
  hook-tests:
    needs: [hook-tests-plan, hook-tests-shard]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Linux shard to succeed
        env:
          PLAN_RESULT: ${{ needs.hook-tests-plan.result }}
          SHARD_RESULT: ${{ needs.hook-tests-shard.result }}
        run: |
          if [ "$PLAN_RESULT" = "success" ] && [ "$SHARD_RESULT" = "success" ]; then
            echo "All Linux hook-test shards passed."
            exit 0
          fi
          echo "::error::Linux hook tests did not pass: plan=$PLAN_RESULT, shards=$SHARD_RESULT"
          exit 1

  # The fleet's primary platform is macOS (state-lock.sh: no flock(1), BSD
  # userland, ~8ms forks) while the job above runs on ubuntu-latest only — so a
  # macOS-only divergence passed CI and surfaced solely in local runs (issue
  # #1473: the portable-handoff-publish lock-contention flake). This job runs
  # the SAME bash-suite discovery on macos-latest; a new test is covered by
  # both jobs with no edit here.
  # Issue #2207: the macOS full run is split into two shards on two macOS runners, because one
  # 3-vCPU job cannot finish the full suite under the 30-minute target. A main push whose
  # selection is not the full set keeps ONE shard.
  # The required check name stays `hook-tests-macos`: the aggregate job below carries that name
  # and passes only when the plan and every shard succeed.
  # Issue #2265: the macOS run is gated to push-to-main. On a pull_request the plan and shards are
  # skipped (no Mac runner is queued), and the aggregate reports success with a notice. A failure
  # on main is reported by `hook-tests-macos-report`.
  hook-tests-macos-plan:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      selection: ${{ steps.plan.outputs.selection }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide macOS shard count
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          SEL="$RUNNER_TEMP/hook-test-selection-plan.txt"
          if ! bash .github/scripts/select-hook-tests.sh --event "$EVENT_NAME" --base "$BASE_SHA" > "$SEL"; then
            printf '# reason: selector exited non-zero: full run\nALL\n# end-of-selection\n' > "$SEL"
          fi
          if grep -Fxq 'ALL' "$SEL"; then
            SHARDS='[{"index":1,"count":2},{"index":2,"count":2}]'
          else
            SHARDS='[{"index":1,"count":1}]'
          fi
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "selection=$(base64 < "$SEL" | tr -d '\n')" >> "$GITHUB_OUTPUT"
          echo "macOS shards: $SHARDS"

  hook-tests-macos-shard:
    needs: hook-tests-macos-plan
    # The matrix is never empty: the plan always emits at least shard 1/1, so a selection the
    # selector resolved to zero bash suites still runs the runner once, as before.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.hook-tests-macos-plan.outputs.shards) }}
    name: hook-tests-macos-shard ${{ matrix.index }}/${{ matrix.count }}
    runs-on: macos-latest
    # session-start-sync-publish-bounds.test.sh's ample-budget control proves its stall
    # assertion is not vacuous by running a HEALTHY publisher inside the hook's
    # deadline. Every bound there is min(budget left, ceiling), so a slow runner
    # that spends the deadline on fixture git work leaves the publish leg too
    # little budget and the control fails with no code change — it did on
    # PR #1689, on a commit that had passed the same job 32 minutes earlier
    # (issue #1698). These runners are the slow ones, so give the control real
    # headroom here; the Linux job above relies on the documented 60s default.
    # This widens the CONTROL only — the stall leg keeps the production 30s.
    env:
      CLAUDE_CONFIG_SYNC_TEST_AMPLE_BUDGET_SECS: "120"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the selector diffs the PR against its base SHA (issue #2153).
          fetch-depth: 0
          persist-credentials: false

      # Decide once per job which suites this PR can affect (issue #2153). Fail toward the
      # full run: a selector that exits non-zero hands the runners ALL, never a partial list.
      # The selection is decided once, by hook-tests-macos-plan, and passed here; shards never
      # re-run the selector, so every shard sees the same suite list the plan counted.
      - name: Restore the planned hook test selection
        env:
          SELECTION_B64: ${{ needs.hook-tests-macos-plan.outputs.selection }}
        run: |
          SEL="$RUNNER_TEMP/hook-test-selection.txt"
          printf '%s' "$SELECTION_B64" | base64 -d > "$SEL" || { echo "::error::cannot restore the planned selection" >&2; exit 1; }
          echo "HOOK_TEST_SELECTION=$SEL" >> "$GITHUB_ENV"
          cat "$SEL"

      - name: Configure git (worktree tests)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      # The runner's /bin/bash is 3.2 (last GPLv2 release) and several suites
      # use bash-4+ features. The discovery runner invokes each suite as
      # `bash suite.sh`, resolved through PATH — Homebrew's bin precedes /bin
      # on these images, so installing its bash is enough. Install only when
      # the PATH-resolved bash is actually old, then assert, so a future image
      # that ships a modern bash skips the install instead of masking it.
      - name: Ensure bash >= 4 on PATH
        run: |
          set -euo pipefail
          if ! bash -c 'exit $(( BASH_VERSINFO[0] >= 4 ? 0 : 1 ))'; then
            brew install bash
            # The probe above hashed `bash` as /bin/bash in THIS shell; without
            # a rehash the assert below would re-test the old binary.
            hash -r
          fi
          bash -c 'echo "bash on PATH: $BASH_VERSION"; [ "${BASH_VERSINFO[0]}" -ge 4 ]'

      # The workflow-reading suites import yaml; ubuntu images preinstall
      # PyYAML, the macOS image does not. Bind the install to the same
      # interpreter the suites resolve (`python3`). That interpreter is
      # Homebrew-managed on this image, so a bare `pip install --user` is
      # refused under PEP 668 (externally-managed-environment) — retry with
      # --break-system-packages, which pip's own refusal names as the
      # override; the plain first try keeps images whose pip predates the
      # flag working. The final import is the real success condition.
      - name: Install PyYAML for workflow-reading suites
        run: |
          set -uo pipefail
          if ! python3 -c 'import yaml' 2>/dev/null; then
            python3 -m pip install --user pyyaml 2>/dev/null \
              || python3 -m pip install --user --break-system-packages pyyaml
          fi
          python3 -c 'import yaml; print("PyYAML available:", yaml.__version__)'

      - name: Run bash hook + script test suites (auto-discovered, macOS shard ${{ matrix.index }}/${{ matrix.count }})
        env:
          # The runner's --json contract (incl. failed_tests) is kept for the failure report (issue #2265).
          SUMMARY_CONTRACT_FILE: ${{ runner.temp }}/hook-test-contract-macos.json
        run: bash .github/scripts/summarize-test-run.sh "Bash test suites (macOS shard ${{ matrix.index }}/${{ matrix.count }})" .github/scripts/run-hook-tests.sh --shard "${{ matrix.index }}/${{ matrix.count }}" --timing-file "$RUNNER_TEMP/hook-test-timing.tsv" --only-file "$HOOK_TEST_SELECTION"

      # Issue #2265: hand this shard's failing suite list to the report job on main. Runs only after a
      # failed step; a shard that failed before the contract existed uploads nothing and the report
      # still files with the run URL.
      - name: Upload this shard's failing suite list
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hook-tests-macos-failures-${{ matrix.index }}
          path: ${{ runner.temp }}/hook-test-contract-macos.json
          if-no-files-found: ignore

      # Advisory: the full per-suite table for balancing the shards (issue #2207). Collapsed.
      - name: Print per-suite timings (collapsed)
        if: always()
        run: |
          F="$RUNNER_TEMP/hook-test-timing.tsv"
          echo "::group::Per-suite timings, macOS shard ${{ matrix.index }}/${{ matrix.count }} (seconds, kind, path)"
          if [ -s "$F" ]; then sort -t "$(printf '\t')" -k1,1nr "$F"; else echo "no timing table was written"; fi
          echo "::endgroup::"

  # The one check reported for macOS. On a pull_request the plan and shards are skipped and this
  # job passes with a notice (issue #2265: macOS runs after merge). On push to main it passes only
  # when the plan and every shard finished with success. Cancelled, skipped and failed shards all
  # fail it there. The zero-suite case is preserved: the shard still runs the runner, which exits 0.
  hook-tests-macos:
    needs: [hook-tests-macos-plan, hook-tests-macos-shard]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every macOS shard to succeed on main
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLAN_RESULT: ${{ needs.hook-tests-macos-plan.result }}
          SHARD_RESULT: ${{ needs.hook-tests-macos-shard.result }}
        run: |
          if [ "$EVENT_NAME" != "push" ]; then
            echo "macOS hook tests run after merge on main (issue #2265); skipped for this pull request."
            exit 0
          fi
          if [ "$PLAN_RESULT" = "success" ] && [ "$SHARD_RESULT" = "success" ]; then
            echo "All macOS hook-test shards passed."
            exit 0
          fi
          echo "::error::macOS hook tests did not pass: plan=$PLAN_RESULT, shards=$SHARD_RESULT"
          exit 1

  # Issue #2265: a failed macOS run on main files a tracking issue, or comments on the open one.
  # Only this job holds `issues: write`. It downloads the shards' failing-suite lists (best effort:
  # a missing list still files with the run URL) and passes every value through env, never shell
  # interpolation of suite names or titles. No concurrency group: a queued group keeps only one
  # pending job, so a third failure would cancel the second report. Two reports racing past the
  # open-issue search can at worst file one duplicate issue, which is cheaper than a lost report.
  hook-tests-macos-report:
    needs: [hook-tests-macos]
    if: always() && github.event_name == 'push' && needs.hook-tests-macos.result == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Download the shards' failing suite lists
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hook-tests-macos-failures-*
          path: ${{ runner.temp }}/macos-failures

      - name: File or update the macOS-on-main failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILURE_DIR: ${{ runner.temp }}/macos-failures
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: |
          set -uo pipefail
          TITLE_PREFIX="macOS hook tests failing on main"
          SHORT_SHA="${HEAD_SHA:0:7}"
          BODY="$RUNNER_TEMP/macos-failure-body.md"
          LIST="$RUNNER_TEMP/macos-failed-suites.txt"
          : > "$LIST"

          # Read each shard's contract; a missing or unreadable one only costs the suite list.
          LIST_NOTE="The failing suite list could not be read; see the run's logs."
          if [ "$DOWNLOAD_OUTCOME" = "success" ]; then
            while IFS= read -r CONTRACT; do
              if jq -r '(.failed_tests // [])[]' "$CONTRACT" >> "$LIST" 2>/dev/null; then
                LIST_NOTE=""
              fi
            done < <(find "$FAILURE_DIR" -type f -name '*.json' 2>/dev/null)
          fi
          if [ -s "$LIST" ]; then
            LIST_NOTE="Failing suites:"
          fi

          {
            echo "macOS hook tests failed on main at commit \`$HEAD_SHA\`."
            echo
            echo "Run: $RUN_URL"
            echo
            [ -n "$LIST_NOTE" ] && printf '%s\n' "$LIST_NOTE"
            while IFS= read -r SUITE; do
              printf -- '- %s\n' "$SUITE"
            done < "$LIST"
            echo
            echo "Filed automatically by the hook-scripts workflow (issue #2265)."
          } > "$BODY"

          # Match the open tracking issue by title prefix; comment on it instead of opening another.
          if ! LISTED="$(gh issue list --repo "$REPO" --state open --search "in:title \"$TITLE_PREFIX\"" --limit 100 --json number,title)"; then
            echo "::error::cannot list open issues; no failure issue was filed" >&2
            exit 1
          fi
          EXISTING="$(printf '%s' "$LISTED" | jq -r --arg p "$TITLE_PREFIX" '[.[] | select(.title | startswith($p))][0].number // empty')"

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body-file "$BODY"
            echo "Commented on the open tracking issue #$EXISTING."
          else
            gh issue create --repo "$REPO" --title "$TITLE_PREFIX (at $SHORT_SHA)" --body-file "$BODY"
          fi

  # macOS system python3 is 3.9.6 (Xcode CLT) while ubuntu-latest ships 3.10+,
  # so a hook that crashes on 3.9 (e.g. eagerly-evaluated PEP 604 unions,
  # issue #560) passes the job above yet fails open locally. Pin 3.9 here. This
  # job runs the SAME Python discovery, so a new test is covered by both jobs
  # with no edit — retiring the "keep both job lists in sync" footgun.
  hook-tests-py39:
    # Python 3.9 builds are available for Ubuntu 24.04, not 26.04.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the selector diffs the PR against its base SHA (issue #2153).
          fetch-depth: 0
          persist-credentials: false

      - name: Select hook test suites this PR can affect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          SEL="$RUNNER_TEMP/hook-test-selection.txt"
          if ! bash .github/scripts/select-hook-tests.sh --event "$EVENT_NAME" --base "$BASE_SHA" > "$SEL"; then
            printf '# reason: selector exited non-zero: full run\nALL\n# end-of-selection\n' > "$SEL"
          fi
          echo "HOOK_TEST_SELECTION=$SEL" >> "$GITHUB_ENV"
          cat "$SEL"

      - name: Set up Python 3.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.9'

      - name: Python hook unit tests (3.9, auto-discovered)
        run: bash .github/scripts/summarize-test-run.sh "Python unit tests (3.9)" .github/scripts/run-python-tests.sh --only-file "$HOOK_TEST_SELECTION"

      - name: Hooks import smoke (3.9)
        run: |
          set -euo pipefail
          for f in .claude/hooks/*.py; do
            python3 -c 'import importlib.util, sys; p = sys.argv[1]; spec = importlib.util.spec_from_file_location("hook_smoke", p); mod = importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); print("import OK:", p)' "$f"
          done
