# Cursor BugBot per-push nudge — DISABLED (issue #1897).
#
# This workflow used to post `@cursor review` (as the repository owner, via the
# CURSOR_REVIEW_PAT secret) after every push, because BugBot does not re-review
# a new HEAD on its own (issue #892). BugBot bills per review, and the owner's
# policy is that no paid AI review starts without the owner's explicit approval
# in chat (.claude/rules/safety.md). A workflow cannot carry that approval, so
# the posting step — and the refusal and review-tier guard steps that existed
# only to narrow it (issues #1356, #1728, #1749) — are gone. No input, secret,
# or helper output can make this workflow post a comment.
#
# The workflow, its trigger, and its job name stay so that any required-status
# check keyed on `post-cursor-review` still reports. The single step only prints
# a notice. The per-review approval path is issue #1898; the inventory of gated
# trigger paths lives in .claude/reference/review-policy.md
# §Paid review authorization.
name: Cursor BugBot review trigger

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Nothing is read or written through the token.
permissions: {}

jobs:
  post-cursor-review:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login == github.repository_owner &&
      !endsWith(github.event.pull_request.user.login, '[bot]')
    steps:
      - name: Notice — BugBot invitations need owner approval
        id: approval-notice
        run: |
          echo "::notice::BugBot was not invited: it is a paid review and needs the owner's explicit approval in chat (issue #1897). This workflow never posts a trigger comment."
